[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-scholar-mcp"
version = "0.2.0"
description = "Deterministic MCP servers for the Semantic Scholar Academic Graph, Recommendations, and Datasets APIs."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28,<1",
    "filelock>=3.16,<4",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
semantic-scholar-s2ag = "semantic_scholar_mcp.s2ag.server:main"
semantic-scholar-recommendations = "semantic_scholar_mcp.recommendations.server:main"
semantic-scholar-datasets = "semantic_scholar_mcp.datasets.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_scholar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that make live requests to Semantic Scholar",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"